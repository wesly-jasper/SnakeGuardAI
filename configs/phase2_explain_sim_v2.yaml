# Phase 2 explanations for the tabular models on sim_v2 (src/explain.py). SIMULATION results only.
#   python -m src.explain --config configs/phase2_explain_sim_v2.yaml
# Associations learned from simulated data; not causal and not clinical evidence.
name: phase2_explain_sim_v2
dataset: data/processed/sim_v2
output_dir: outputs/phase2/explain_sim_v2
model_seed: 0
validation_fraction: 0.15
n_repeats: 5                # permutation-importance repeats
models:
  xgboost:
    params: {n_estimators: 600, max_depth: 4, learning_rate: 0.05, subsample: 0.9,
             colsample_bytree: 0.9, early_stopping_rounds: 30}
  xgboost_context:
    params: {n_estimators: 600, max_depth: 4, learning_rate: 0.05, subsample: 0.9,
             colsample_bytree: 0.9, early_stopping_rounds: 30}
  random_forest:
    params: {n_estimators: 300, max_depth: null, min_samples_leaf: 5, class_weight: null}
