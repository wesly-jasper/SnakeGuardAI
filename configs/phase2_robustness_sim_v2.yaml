# Phase 2 robustness to imperfect symptom reporting on sim_v2. SIMULATION results only.
#   python -m src.robustness --config configs/phase2_robustness_sim_v2.yaml
# Models train on clean inputs; corruption is applied to a copy of the evaluation inputs only.
name: phase2_robustness_sim_v2
dataset: data/processed/sim_v2
output_dir: outputs/phase2/robustness_sim_v2
seeds: [0, 1, 2]
validation_fraction: 0.15
torch_threads: 4
decision_thresholds: [0.01, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.5]
levels: [0.0, 0.05, 0.1, 0.2, 0.3]
corruptions: [missing_symptom, omission, false_report, onset_noise, missing_presentation]
# ASSUMPTION: symptoms a patient reports (and may fail to mention), as opposed to examined signs.
omission_symptoms: [local_pain, abdominal_pain, vomiting, headache]
models:
  rule: {}
  xgboost:
    params: {n_estimators: 600, max_depth: 4, learning_rate: 0.05, subsample: 0.9,
             colsample_bytree: 0.9, early_stopping_rounds: 30}
  logistic_regression:
    params: {C: 1.0, max_iter: 2000, class_weight: null}
  random_forest:
    params: {n_estimators: 300, max_depth: null, min_samples_leaf: 5, class_weight: null}
  transformer:
    d_model: 64
    n_heads: 4
    n_layers: 2
    dropout: 0.1
    lr: 0.001
    weight_decay: 0.01
    batch_size: 256
    max_epochs: 60
    patience: 8
    species_loss_weight: 1.0
